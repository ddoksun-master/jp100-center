<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef6fd">
  <meta name="application-name" content="증평체력인증센터">
  <meta name="mobile-web-app-capable" content="yes">
  <title>증평체력인증센터</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#2f3a45}
    body{min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 35%,#fff 0%,#eef6fd 58%,#dcecf8 100%);display:flex;align-items:center;justify-content:center;padding:24px}
    .welcome{width:min(100%,520px);background:#fff;border-radius:22px;padding:22px 18px 26px;box-shadow:0 12px 40px rgba(34,72,105,.10);text-align:center}
    .photos{position:relative;width:100%;height:clamp(190px,42vh,360px);overflow:hidden;border-radius:13px;background:#e6f2fb}
    .track{display:flex;width:100%;height:100%;transition:transform .7s ease}
    .track img{display:block;flex:0 0 100%;width:100%;height:100%;object-fit:cover;object-position:center 40%}
    .dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:8px}
    .dots button{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 4px rgba(0,0,0,.35)}
    .dots button.active{background:#fff;transform:scale(1.15)}
    .move-button{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;margin:24px auto 0;padding:14px 20px;border:0;border-radius:12px;background:#246fbd;color:#fff;text-decoration:none;font-size:18px;font-weight:700;letter-spacing:-.02em;box-shadow:0 5px 14px rgba(36,111,189,.20);-webkit-tap-highlight-color:transparent}
    .move-button:active{transform:translateY(1px);background:#1d5fa5}
    .message{white-space:pre-line;margin:22px 4px 0;font-family:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:clamp(17px,4.5vw,21px);font-weight:500;line-height:1.75;color:#3a4552;word-break:keep-all}
    @media(max-width:380px){body{padding:14px}.welcome{padding:16px 13px 21px}.photos{height:34vh}.message{margin-top:18px}}
    @media(prefers-reduced-motion:reduce){.track{transition:none}}
  </style>
</head>
<body>
  <main class="welcome" aria-label="증평체력인증센터 환영 화면">
    <div class="photos" aria-label="센터 사진">
      <div class="track" id="track"></div>
      <div class="dots" id="dots" aria-label="사진 위치"></div>
    </div>
    <p class="message">증평체력인증센터입니다.

    photos.forEach((src, index) => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = `센터 사진 ${index + 1}`;
      track.appendChild(img);
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.setAttribute('aria-label', `사진 ${index + 1}`);
      dot.addEventListener('click', () => show(index));
      dots.appendChild(dot);
    });
    function show(index) {
      current = index;
      track.style.transform = `translateX(-${current * 100}%)`;
      [...dots.children].forEach((dot, i) => dot.classList.toggle('active', i === current));
    }
    show(0);
    if (photos.length > 1) setInterval(() => show((current + 1) % photos.length), 3500);
