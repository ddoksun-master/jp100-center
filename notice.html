<style>
  /* 모든 크기는 rem: 화면 너비에 비례 (360px 폰 = 16px 기준). 넘치는 글씨는 JS fit()이 한 줄에 맞게 줄임 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:min(calc(100vw / 22.5), 23px);-webkit-text-size-adjust:100%}
  html,body{margin:0}
  body{background:#f7fbff;color:#2f3a45;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;font-size:1rem;-webkit-user-select:none;user-select:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  button{font-family:inherit}
  .fit{white-space:pre}
  .wrap{max-width:520px;margin:0 auto;padding-bottom:2.5rem}

  /* 상단 띠: 흰 바탕 · 좌측 증평체력인증센터 수강신청 · 우측 국민체력100 (두 번 누르면 관리자) */
  .hero{background:#fbf6ea;color:#80561a;padding:.35rem 1rem;border-bottom:.2rem solid #d9b26f}
  .toprow{display:flex;justify-content:space-between;align-items:center;min-height:2.1rem}
  .hname{line-height:1.2;white-space:nowrap;text-align:right}
  .hname b{display:block;font-size:.8rem;font-weight:700;letter-spacing:.04em;color:#4d4120}
  .hname span{display:block;font-size:.8rem;font-weight:700;letter-spacing:.2em;margin-right:-.2em;color:#a97c38}
  #adminBtn{display:block;background:none;border:0;padding:0;margin:0;cursor:default;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  .hl{height:2.1rem;width:auto;aspect-ratio:1230/290;display:block;--c0:#80561a;--c1:#a97c38;--band:#cfaa7a;--run:#fff}
  .hl .wm .c{fill:#80561a;transform-box:fill-box}
  .hl .wm .c4,.hl .wm .c5{fill:#a97c38}
  
  body.in #v0{animation:up2 .6s ease both}
  @keyframes up2{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* 오프닝(로딩) 화면: 크림 바탕 · 세로 로고 → 헤더로 날아가 자리잡음 */
  .opn{position:fixed;inset:0;z-index:30;background:#fbf6ea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s;--c0:#80561a;--c1:#a97c38;--band:#cfaa7a;--run:#fff;--t1:#80561a;--t2:#a97c38}
  .opn.out{opacity:0;pointer-events:none}
  .opn .e,.opn .w{transform-origin:0 0;display:block}
  .opn .e{width:min(46vw,210px)}.opn .w{width:min(76vw,340px)}
  .opn .fade{display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .35s}.opn .fade.h{opacity:0}
  .opn .line{width:60px;height:3px;background:#cfaa7a;border-radius:2px}
  .opn .nm{text-align:center}
  .opn .nm b{display:block;font-size:1.35rem;letter-spacing:2px;color:#4d4120;font-weight:800}
  .opn .nm span{display:block;margin-top:5px;font-size:1.05rem;letter-spacing:3px;color:#a97c38;font-weight:700}
.em .ring,.em .band,.em .p{transform-box:fill-box;transform-origin:center}
.em.play .disc{animation:disc calc(.7s*var(--k,1)) cubic-bezier(.2,.9,.3,1.2) both;transform-box:fill-box;transform-origin:center}
.em.play .band{animation:band calc(.8s*var(--k,1)) cubic-bezier(.6,0,.2,1) calc(.45s*var(--k,1)) both}
.em.play .run{animation:wipe calc(.9s*var(--k,1)) cubic-bezier(.6,0,.2,1) calc(.9s*var(--k,1)) both}
.em.play .head{animation:drop calc(.7s*var(--k,1)) cubic-bezier(.3,1.5,.5,1) calc(1.7s*var(--k,1)) both}
.em.play .dot{animation:pop calc(.6s*var(--k,1)) cubic-bezier(.3,1.6,.5,1) calc(2.0s*var(--k,1)) both}
.em.play{animation:pulse calc(.6s*var(--k,1)) ease-in-out calc(2.7s*var(--k,1)) both}
@keyframes disc{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes band{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes wipe{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-70px) scale(.5)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.wm .c{transform-box:fill-box;transform-origin:center bottom;fill:var(--t1)}
.wm .c5,.wm .c4{fill:var(--t2)}




  /* 본문 제목 */

  .title{color:#2f3a45;font-weight:800}
  .period{color:#5b7189;font-weight:700;font-size:1.05rem;margin-top:.2rem;text-align:center}
  .cdbar{background:#e6f2fb;color:#00457f;text-align:center;font-weight:700;font-size:1.1rem;padding:.55rem .5rem;margin-top:.9rem;border-top:.1rem solid #c9dff0;border-bottom:.1rem solid #c9dff0}

  .cls .t{font-size:1.05em;font-weight:700;color:#6b8299;margin-top:.3em}

  .cls.sm{padding:1.6rem .3rem 1.5rem;border-radius:1.4rem}

  /* 반 목록: 6줄 세로 리스트, 오전/오후/야간 색 구분 */
  .plist{display:flex;flex-direction:column;gap:.75rem}
  .rowc{display:flex;align-items:center;justify-content:space-between;gap:.5em;background:var(--bg);border:.1rem solid var(--bd);border-radius:1.25rem;padding:.6rem .75rem;cursor:pointer;white-space:nowrap}

  /* 신청할 반 선택: 2칸 x 3줄 */

  /* 확인 화면 */

/* ===== 환영 팝업: 센터 사진 + 환영 문구 → 신청 안내 ===== */
.wdim{position:fixed;inset:0;z-index:13;background:rgba(10,25,18,.6);display:none;align-items:center;justify-content:center;padding:.8rem}
.wbox{background:#fff;border-radius:1.2rem;width:100%;max-width:28.5rem;max-height:calc(100vh - 1.6rem);overflow:auto;padding:1.3rem 1rem 1rem;text-align:center;display:flex;flex-direction:column}
.wh{font-size:2.2rem;font-weight:800;color:#00457f;line-height:1.3;margin:0 0 .8rem}
.wbox .slides{margin:0;height:min(13rem,30vh);flex:none}
.wm{font-family:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;font-size:1.2rem;font-weight:400;color:#3a4552;line-height:1.65;margin:.8rem 0 .9rem}   /* 소개글처럼 작게 */
.wok{display:block;width:100%;height:3.4rem;flex:none;font-family:inherit;font-size:1.25rem;font-weight:700;letter-spacing:.04em;border:0;border-radius:.8rem;background:#00457f;color:#fff;cursor:pointer}
.wok:active{transform:scale(.97)}
.wdiv{height:1px;background:#d5dee8;margin:.2rem 0 .9rem;flex:none}
.wq{font-size:1.65rem;word-break:keep-all;font-weight:800;color:#00457f;margin:.2rem 0 .2rem}
.wsub{font-size:1.2rem;font-weight:500;color:#5b7189;margin:0 0 .8rem;line-height:1.4}
.wsolo{display:block;width:100%;height:3.4rem;flex:none;margin-top:.6rem;font-family:inherit;font-size:1.25rem;font-weight:700;letter-spacing:.04em;border:0;border-radius:.8rem;background:#eef2f6;color:#00457f;cursor:pointer}
.wsolo:active{transform:scale(.97)}
.wback{display:block;width:100%;height:3.4rem;flex:none;margin-top:.6rem;font-family:inherit;font-size:1.3rem;font-weight:700;border:0;border-radius:.8rem;background:#e3e7e5;color:#2f3a45;cursor:pointer}
.wg{text-align:left;font-size:1.2rem;line-height:1.6;font-weight:700;background:#f6f8f7;border-radius:1rem;padding:.8rem .9rem;white-space:pre-wrap;word-break:keep-all;flex:1 1 auto;min-height:0;overflow:auto;margin-bottom:.9rem}

/* ===== 신청 · 조회 양식 (안내선을 따라가는 한 화면 한 질문) ===== */
#vg{padding-bottom:2rem}
.gs{padding:1rem 1rem 0}
.gt1{font-size:1.9rem;font-weight:800;line-height:1.3;text-align:center;margin:1.2rem 0 .4rem}
.gt2{font-size:1.4rem;font-weight:700;text-align:center;color:#4a6178;line-height:1.5}
.glab{font-size:1.35rem;font-weight:700;margin:0 0 .5rem;display:flex;justify-content:space-between;align-items:baseline}
.glab small{font-size:.75em;font-weight:500;color:#7b8a83}
.gin{width:100%;font-family:inherit;font-size:1.9rem;font-weight:700;padding:.65rem 1rem;border:.25rem solid #00457f;border-radius:1.1rem;background:#fff;color:#2f3a45;outline:none;-webkit-user-select:text;user-select:text}
.gin.bl{animation:gbl 1.2s ease-in-out infinite}

.gin::placeholder{color:#b4beb9;font-weight:500}
.gfld{margin-bottom:1.1rem}
.ghint{display:flex;align-items:center;justify-content:center;gap:.4rem;font-size:1.3rem;font-weight:700;color:#b86a00;margin-top:.5rem}
.ghint s{text-decoration:none;display:inline-block;animation:gup .7s ease-in-out 4}
@keyframes gup{50%{transform:translateY(-.3rem)}}
.gb{display:block;width:100%;border:0;padding:0;margin-top:.9rem;background:none;cursor:pointer;text-align:center;font-family:inherit}
.gb b{display:block;height:4.2rem;line-height:4.2rem;background:#00457f;color:#fff;font-size:1.8rem;font-weight:700;letter-spacing:.06em;border-radius:.8rem}
.gb i{display:block;font-style:normal;color:#00457f;font-size:1.3rem;font-weight:700;padding:.5rem 0 0}
.gb i s{text-decoration:none;display:inline-block;margin-right:.1rem;animation:fup2 .8s ease-in-out infinite}

.gb:active{transform:scale(.97)}
.gb.off{animation:none;cursor:default}
.gb.off b{background:#c9d2dc;color:#fff}
.gb.busy{animation:none;opacity:.6}
.gbtn{display:block;width:100%;height:3.6rem;margin-top:.8rem;font-family:inherit;font-size:1.4rem;font-weight:700;border-radius:.8rem;cursor:pointer;background:#fff;color:#2f3a45;border:.1rem solid #00457f}
.gbtn.gray{background:#e3e7e5;border:0;box-shadow:0 .2rem 0 #c9cfcc}
.gback{display:block;margin:1.4rem auto 0;padding:.4rem .8rem;background:none;border:0;font-family:inherit;font-size:1.2rem;font-weight:700;color:#6b8299;text-decoration:underline;cursor:pointer}
.gnote{margin-top:.9rem;border-radius:.8rem;padding:.5rem;font-size:1.3rem;font-weight:700;line-height:1.5;text-align:center;color:#c62828}
.gwarn{margin-top:.8rem;font-size:1.2rem;font-weight:700;line-height:1.5;color:#b86a00}
.gwarn.r{color:#c62828}
.gdim{position:fixed;inset:0;background:rgba(10,25,18,.6);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:11}
.gbox{background:#fff;border-radius:1.2rem;padding:1.6rem 1.1rem 1.2rem;width:100%;max-width:28rem;text-align:center;max-height:calc(100vh - 2rem);overflow:auto}
.gcfm{background:#e6f2fb;border-radius:1.1rem;padding:1rem .4rem;text-align:center;font-size:2.6rem;font-weight:800;line-height:1.35;margin-top:.8rem;color:#2f3a45}
/* 반 고르기 */
.gplist{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1rem}
.grow{position:relative;display:flex;flex-direction:column;align-items:center;gap:.05em;background:#fff;border:.1rem solid #cfdbe8;border-top:.7rem solid var(--bd);border-radius:.8rem;padding:.7rem .2rem;cursor:pointer;font-size:1rem;min-width:0}
.grow .gn{font-size:1.75em;white-space:nowrap;font-weight:800;color:#2f3a45;letter-spacing:-.02em}
.grow .gt{font-size:1.25em;font-weight:700;color:#00457f;margin-top:.15em}
.grow .gg{font-size:1.15em;font-weight:700;color:#00457f;margin-top:.1em;white-space:nowrap}
.grow .gg.w{color:#b86a00}
.grow .gg.c{color:#5b7189;font-size:1em}
.grow.sel{background:var(--dk);border-color:var(--dk)}
.grow.sel .gn,.grow.sel .gt,.grow.sel .gg{color:#fff}
.grow.dis{opacity:.55;border-top-color:#cfdbe8}
.grow.cur{opacity:.55;cursor:default}
/* 회원구분 */
.gmem{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.gmc{background:#fff;border:.1rem solid #cfdbe8;border-radius:.8rem;padding:1rem .3rem;text-align:center;cursor:pointer}
.gmc .gn{font-size:1.7rem;font-weight:800;color:#2f3a45;white-space:nowrap}
.gmc .gs2{font-size:1.1rem;font-weight:700;color:#6b8299;margin-top:.25em}
.gmc .gh{font-size:1.5rem;line-height:1;margin-bottom:.3rem}
.gmc .gh s{text-decoration:none;display:inline-block;animation:chdn .8s ease-in-out infinite}
.gmc.sel{background:#e6f2fb;border:.2rem solid #00457f;padding:calc(1rem - .1rem) calc(.3rem - .1rem)}
/* 신청 완료 뒤: 체력측정 예약 안내 · 주의사항 동의 */
.gfit{margin-top:1.1rem;border:.15rem solid #00457f;border-radius:1.1rem;background:#fff;padding:1rem .9rem}
.gfit .gfh{font-size:1.45rem;font-weight:800;color:#00457f;text-align:center}
.gfit .gfs{font-size:1.15rem;font-weight:700;text-align:center;color:#5b7189;line-height:1.5;margin-top:.3rem}
.gfit .gfw{font-size:2rem;font-weight:800;text-align:center;line-height:1.35;margin:.6rem 0 .1rem;color:#2f3a45}
.gfit .gfn{margin-top:.9rem;padding-top:.8rem;border-top:.1rem dashed #c9d6e3}
.gfit .gfnh{font-size:1.25rem;font-weight:700;color:#b86a00}
.gfit .gfn p{margin:.5rem 0 0;font-size:1.15rem;font-weight:700;line-height:1.5;color:#2f3a45;white-space:pre-line;padding-left:1.5em;text-indent:-1.5em}
.gchk{display:flex;align-items:center;gap:.8rem;width:100%;margin-top:1rem;padding:.9rem .8rem;border:.2rem solid #00457f;border-radius:1rem;background:#fff;cursor:pointer;text-align:left;font-family:inherit}
.gchk .gbx{flex:none;width:2.6rem;height:2.6rem;border:.2rem solid #00457f;border-radius:.5rem;display:flex;align-items:center;justify-content:center;font-size:1.9rem;font-weight:800;color:#fff;background:#fff}
.gchk.on .gbx{background:#00457f}
.gchk b{font-size:1.35rem;font-weight:700;color:#2f3a45;line-height:1.35}
.gchk.bl{animation:gbl 1.2s ease-in-out infinite}


/* 첫 화면 가이드 손 */
.ahand{display:none;text-align:center;font-size:1.4rem;font-weight:700;color:#b86a00;margin:.35rem 0 0;line-height:1.3}
.ahand.on{display:block}
.ahand s{text-decoration:none;display:inline-block;margin-right:.2rem;animation:fup2 .8s ease-in-out infinite}
@keyframes fup2{50%{transform:translateY(-.4rem)}}
/* 동의서: 아래에서 위로 올라오는 시트 */
.csov{position:fixed;inset:0;z-index:15;background:none;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;transition:visibility 0s .35s}
.csov.on{visibility:visible;transition:none}
.csh{background:#fff;border-radius:1.5rem 1.5rem 0 0;width:100%;max-width:30rem;max-height:92vh;display:flex;flex-direction:column;padding:.7rem 1rem calc(1rem + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);box-shadow:0 -.4rem 1.6rem rgba(0,0,0,.2)}
.csov.on .csh{transform:none}
.csh .grab{width:3.2rem;height:.35rem;border-radius:.2rem;background:#cfd8e0;margin:0 auto .7rem;flex:none}
.cth{font-size:2rem;font-weight:800;color:#00457f;text-align:center;line-height:1.3;flex:none}
.cts{font-size:1.2rem;font-weight:700;color:#5b7189;text-align:center;margin:.2rem 0 .7rem;line-height:1.4;flex:none}
.csl{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:0;padding:0;background:#f3f5f7;border-radius:.8rem}
.cit{display:block;width:100%;text-align:left;padding:.85rem .7rem;border:0;border-bottom:.1rem solid #dfe5ea;border-radius:0;background:transparent;font-family:inherit;cursor:pointer;flex:none}
.cit:last-child{border-bottom:0}
.cit .crow{display:flex;align-items:flex-start;gap:.7rem}
.cit .gbx{flex:none;width:2.4rem;height:2.4rem;margin-top:.1rem;border:.2rem solid #00457f;border-radius:.5rem;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;color:#fff;background:#fff}
.cit.on .gbx{background:#00457f}
.cit .ct{flex:1;min-width:0;font-size:1.25rem;font-weight:700;line-height:1.5;color:#2f3a45;white-space:pre-line;word-break:keep-all}
.cit .chd{display:none;font-style:normal;font-size:1.2rem;font-weight:700;color:#b86a00;margin:0 0 .45rem;text-align:left}
.cit .chd s{text-decoration:none;display:inline-block;animation:chdn .8s ease-in-out infinite}
@keyframes chdn{50%{transform:translateY(.3rem)}}
.cit.nx .chd{display:block}
.cit.nx .gbx,.cit.bl .gbx{animation:gbxb 1.2s ease-in-out infinite}

.cit.inf{cursor:default}
.cit.inf .crow{align-items:flex-start}
.cit .cn{flex:none;font-size:1.5rem;font-weight:700;color:#00457f;line-height:1.4;width:1.6rem}
.ccnt{flex:none;text-align:center;font-size:1.2rem;font-weight:700;color:#b86a00;margin:.7rem 0 0;min-height:1.6rem}
.ccnt.ok{color:#00457f}


.gb.or b{background:#ef8a17;box-shadow:0 .25rem 0 #b86a00}
.gb.or i{color:#b86a00}
.gmore{display:none;position:fixed;left:0;right:0;bottom:0;transform:none;z-index:9;width:100%;height:3.4rem;padding:0 0 env(safe-area-inset-bottom);border:0;border-radius:0;background:rgba(255,255,255,.78);color:#b86a00;font-family:inherit;font-size:1.4rem;font-weight:700;box-shadow:none;-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);animation:gmb 2.4s ease-in-out infinite}

/* ---------- 반 고르기: 몇 시를 희망하시나요? → 오전/오후/야간 → 카드 ---------- */
.zq{font-size:2rem;font-weight:800;text-align:center;color:#2f3a45;margin:.9rem 0 1rem;line-height:1.3}
.zsub{text-align:center;font-size:1.35rem;font-weight:700;color:#5b7189;margin:-.5rem 0 .6rem}
.ztabs{position:relative;display:flex;background:#fff;border-bottom:.1rem solid #e6ebf0;margin:0 -.2rem}
.ztab{flex:1;position:relative;border:0;background:#fff;font-family:inherit;padding:1.1rem 0 1rem;text-align:center;cursor:pointer;border-left:.1rem solid #eef1f4}
.ztab:first-child{border-left:0}
.ztab span{font-size:2.3rem;font-weight:700;color:#9aa5b1;display:inline-block;padding-bottom:.25rem;border-bottom:.35rem solid transparent}
.ztab.on span{color:#2f3a45;border-bottom-color:var(--bd)}
.ztabs.tg{padding-bottom:3rem}
.ztab.gl{animation:ztgb 1s ease-in-out infinite}

.ztgh{position:absolute;left:0;bottom:.4rem;text-align:center;transition:transform .7s ease;pointer-events:none;font-size:1.9rem;line-height:1}
.zpanel{padding:.2rem 0 .5rem}
.ztg{display:grid;grid-template-columns:1fr 1fr;column-gap:.7rem;row-gap:.2rem;padding-top:1rem}
.ztg.one{grid-template-columns:1fr}
.zc{display:flex;flex-direction:column}
.zt{display:flex;flex-direction:column;align-items:center;justify-content:center;border:.15rem solid #cfdbe8;border-top:.55rem solid var(--bd);border-radius:.8rem;padding:.8rem .3rem;font-family:inherit;min-height:8.4rem;background:#fff;color:#2f3a45;cursor:pointer}
.zt .tt{font-size:2.9rem;font-weight:800;line-height:1.1}
.zt .tn{font-size:1.15rem;font-weight:700;color:#6b8299;margin-top:.15rem}
.zt .ts{font-size:1.35rem;font-weight:700;margin-top:.4rem;color:#00457f}
.zt .ts.w{color:#b86a00}
.zt.soon{background:#f3f5f7;color:#6b7885}
.zt.soon .ts{color:#6b7885}
.zt.soon.bl{animation:zbl 1.2s ease-in-out infinite}

.zt.shut{opacity:.5;cursor:default}
.zt.shut .ts{color:#6b7885}
.zt.cur{opacity:.55;cursor:default}
.zbl{min-height:3rem;text-align:center;font-size:1.15rem;font-weight:700;color:#b86a00;padding-top:.4rem;line-height:1.3}
.zbl b{display:block;color:#7a1010}
/* 상단 고정 공지: 오픈 1시간 전부터 나타남 */
#zobar{background:#fff1dc;color:#7a4a00;border-bottom:.1rem solid #f0d3a8;padding:.6rem .8rem;text-align:center;font-weight:700;font-size:1.15rem;line-height:1.45}
#zobar b{color:#b02a1a}
.gselc{text-align:center;font-size:1.3rem;font-weight:700;color:#00457f;background:#e6f2fb;border-radius:.8rem;padding:.55rem .5rem;margin:0 0 .9rem}


/* 신청앱·일정공지앱 상단 헤더: 같은 높이, 좁은 폭(얇게) */
.hero,.hero{padding:.18rem 1rem!important;border-bottom-width:.14rem!important}
.toprow{min-height:1.5rem!important}
.hl{height:1.5rem!important}
.hname b,.hname span{font-size:.6rem!important}

.ttband{position:relative;display:block;width:100%;padding:.95rem 1rem;border:0;background:#0a7bc8;color:#fff;font-family:inherit;text-align:center;cursor:pointer}
.ttband b{display:block;font-size:1.25rem;font-weight:700;line-height:1.3}
.ttband:active{filter:brightness(.92)}


/* 진행 표시: 로딩 화면의 '불러오는 중…' (자리를 차지하지 않게 문구 아래에 띄움) · 화면 읽기 전용 안내 */
.opn .fade{position:relative}
.opn .opst{margin-top:.5rem;text-align:center;font-size:1.5rem;font-weight:800;color:#00457f;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.a-btn[aria-busy=true]{opacity:.7}


/* ===== 접근성 공통 (승인 토큰) =====
   · 키보드 포커스 표시: 테두리를 지운 곳(입력칸 등)에 :focus-visible 링 — 손가락 터치에는 버튼 링이 안 보임
   · 입력칸 글씨 16px 이상: 아이폰이 입력할 때 화면을 저절로 확대하지 않게 (확대 금지 해제와 짝) */
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,.gin:focus-visible,.name:focus-visible,.a-in:focus-visible,summary:focus-visible{outline:3px solid #0a7bc8!important;outline-offset:2px}
.a-in,.a-cl .a-in{font-size:16px}
/* div→button 으로 바꾼 곳: 겉모습은 그대로 (기본 버튼 모양만 지움) */
/* 헤더 높이 56px 통일 (index·notice 공통 토큰) — 바로 아래 오픈 안내 띠(#zobar)는 헤더 밖 높이로 따로 붙음 */
.hero{padding:0 1rem!important;border-bottom-width:2px!important}
.toprow{height:54px;min-height:0!important}
.hl{height:28px!important}
.hname b,.hname span{font-size:12px!important}
/* 의미 없는 보조 버튼(처음으로·다시 고를게요·아니요·닫기·나중에·취소)은 글자(밑줄)만 — 배경·테두리·그림자 없음, 누르는 높이는 그대로 */
.go.gray,.gbtn.gray,.bb button.gray,.sheet button,.wback{background:none!important;border:0!important;box-shadow:none!important;color:#5b7189!important;text-decoration:underline;text-underline-offset:.2em;font-weight:700;letter-spacing:.02em}
.go.gray:active,.gbtn.gray:active,.bb button.gray:active,.sheet button:active{background:#eef3f8!important;transform:none;filter:none}
button.gmc,button.a-clh{-webkit-appearance:none;appearance:none;margin:0;width:100%;font:inherit;color:inherit;letter-spacing:inherit}
button.gmc>span{display:block}
button.a-clh{background:none;border:0;border-radius:0;text-align:left}
/* 움직임 줄이기 설정: 깜빡임·손가락 반복을 멈추고 고정 강조(배경·테두리)로 */
@media not all{
  .gin.bl,.gchk.bl{animation:none;background:#e6f2fb}
  .cit.nx .gbx,.cit.bl .gbx{animation:none;background:#ffe3bd}
  .zt.soon.bl{animation:none;background:#ffe3bd}
  .ztab.gl{animation:none}
  .ztabs.tg .ztab{background:#eef6fd}
  .ztgh{display:none}
  .ghint s,.gb i s,.ahand s,.gmc .gh s,.cit .chd s{animation:none}
  .gmore{animation:none;background:rgba(255,240,207,.92)}
  .go.nudge{animation:none}
  .opn.wait #emo{animation:none}
  .slides .trk{transition:none!important}
  body.in #v0{animation:none}
}

#badge,#pvb,.pv,.badge{display:none!important}

/* ===================== v1 디자인 (디자인팀 · 2026-11-16) =====================
   모드: <html data-mode="guide|solo">  가이드=어르신 기준 / 혼자=한 단계 작게·촘촘하게. 화면 구성·순서·버튼 위치는 같음.
   장식 규칙: 테두리·배경·그림자는 주 버튼 1개, 선택된 상태, 입력칸, 팝업에만. 보조 동작은 밑줄 글자. 묶음은 굵은 제목과 여백. */
html[data-mode]{font-size:16px;--navy:#00457F;--ink:#2F3A45;--sky:#E6F2FB;--face:#F3F7FB;--sub:#5B7189;--hint:#A35E00;--or:#F89828;--glo:#FFE6C4;--ok:#5FA08A;--no:#C62828;--wt:#6B8299;--line:#DCE5EE}
html[data-mode=guide]{--t1:2rem;--t2:1.5rem;--t3:1.25rem;--t4:1.06rem;--t5:.9rem;--btn:3.5rem;--gap:1rem;--big:3.1rem}
html[data-mode=solo]{--t1:1.5rem;--t2:1.25rem;--t3:1.06rem;--t4:.9rem;--t5:.85rem;--btn:3.25rem;--gap:.75rem;--big:2.1rem}
html[data-mode] body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;font-weight:500;color:var(--ink);background:#fff!important;overscroll-behavior-y:contain}
html[data-mode] .wrap{padding-bottom:1.5rem}
html[data-mode] [hidden]{display:none!important}
